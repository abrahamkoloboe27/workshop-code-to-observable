name: CI

on:
  push:
  pull_request:

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: workshop
          POSTGRES_PASSWORD: workshop-demo-password
          POSTGRES_DB: workshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workshop -d workshop"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://workshop:workshop-demo-password@localhost:5432/workshop
      PGPASSWORD: workshop-demo-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Load schema and seed data
        run: psql -h localhost -U workshop -d workshop -v ON_ERROR_STOP=1 -f db/init.sql
      - name: Pytest
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Download wheels for the offline image build
        run: pip download --no-cache-dir -d wheels -r app/requirements.txt
      - name: Build image
        run: docker build -t workshop-app:ci .
