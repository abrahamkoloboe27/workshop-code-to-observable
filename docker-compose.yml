services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workshop-demo-password}
      POSTGRES_DB: ${POSTGRES_DB:-workshop}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 : on interroge le TCP, pas la socket Unix. Pendant le chargement
      # de db/init.sql, Postgres tourne avec listen_addresses='' — la socket repond
      # deja alors que le reseau n'ecoute pas encore.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-workshop} -d ${POSTGRES_DB:-workshop}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 30s
      start_interval: 1s

  app:
    build: .
    image: workshop-app:local
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-workshop}:${POSTGRES_PASSWORD:-workshop-demo-password}@db:5432/${POSTGRES_DB:-workshop}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.13.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:13.1.0-slim
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/workshop.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-workshop}:${POSTGRES_PASSWORD:-workshop-demo-password}@db:5432/${POSTGRES_DB:-workshop}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    volumes:
      - ./observability/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${CADDY_PORT:-8080}:8080"
    depends_on:
      - app
      - grafana

volumes:
  pgdata:
